# Local development stack — no K8s needed
# Usage: docker compose -f deploy/docker-compose.yml up
services:
  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma

  query-api:
    build:
      context: ../
      dockerfile: Dockerfile
      target: query-api
    ports:
      - "8080:8000"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - BEDROCK_REGION=${BEDROCK_REGION:-us-east-1}
      - EMBED_MODEL=${EMBED_MODEL:-amazon.titan-embed-text-v2:0}
      - LLM_MODEL=${LLM_MODEL:-anthropic.claude-3-5-sonnet-20241022-v2:0}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      - chromadb

  frontend:
    build:
      context: ../
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "8501:8501"
    environment:
      - QUERY_API_URL=http://query-api:8000
    depends_on:
      - query-api

  # One-shot: run this to embed PDFs into ChromaDB
  embedder:
    build:
      context: ../
      dockerfile: Dockerfile
      target: embedder
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PDF_DIR=/data/pdfs
      - BEDROCK_REGION=${BEDROCK_REGION:-us-east-1}
      - EMBED_MODEL=${EMBED_MODEL:-amazon.titan-embed-text-v2:0}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ../safety_data:/data/pdfs:ro
    depends_on:
      - chromadb
    profiles:
      - ingest  # only runs with: docker compose --profile ingest up embedder

volumes:
  chromadb_data:
