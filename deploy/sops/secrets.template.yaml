# Template for SOPS-encrypted secrets
# Copy this to secrets.dec.yaml, fill in values, then encrypt with:
#   sops --encrypt deploy/sops/secrets.dec.yaml > deploy/sops/secrets.enc.yaml
---
# AWS credentials for Bedrock API access
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: ancap
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_ACCESS_KEY"
  AWS_DEFAULT_REGION: "us-east-1"
---
# Cloudflare Tunnel token
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel
  namespace: ancap
type: Opaque
stringData:
  TUNNEL_TOKEN: "YOUR_CLOUDFLARE_TUNNEL_TOKEN"
---
# Non-secret config (not encrypted by SOPS — uses unencrypted_regex)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ancap-config
  namespace: ancap
data:
  S3_BUCKET: "ancap-data"
  BEDROCK_REGION: "us-east-1"
  EMBED_MODEL: "amazon.titan-embed-text-v2:0"
  LLM_MODEL: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  CHROMA_HOST: "chromadb"
  CHROMA_PORT: "8000"
  PDF_DIR: "/data/pdfs"
  CHROMA_DIR: "/data/chromadb"
