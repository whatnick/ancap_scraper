# DEPRECATED: Secrets are now managed via SOPS.
# See deploy/sops/README.md for setup instructions.
#
# The Tiltfile decrypts deploy/sops/secrets.enc.yaml into
# deploy/k8s/secrets.decrypted.yaml at deploy time.
#
# This file is kept only as a reference. Do NOT put real credentials here.
---
# AWS credentials for Bedrock API access
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: ancap
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "MANAGED_BY_SOPS"
  AWS_SECRET_ACCESS_KEY: "MANAGED_BY_SOPS"
  AWS_DEFAULT_REGION: "us-east-1"
---
# Cloudflare Tunnel token
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel
  namespace: ancap
type: Opaque
stringData:
  TUNNEL_TOKEN: "MANAGED_BY_SOPS"
---
# S3 bucket config
apiVersion: v1
kind: ConfigMap
metadata:
  name: ancap-config
  namespace: ancap
data:
  S3_BUCKET: "ancap-data"
  BEDROCK_REGION: "us-east-1"
  EMBED_MODEL: "amazon.titan-embed-text-v2:0"
  LLM_MODEL: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  CHROMA_HOST: "chromadb"
  CHROMA_PORT: "8000"
  PDF_DIR: "/data/pdfs"
  CHROMA_DIR: "/data/chromadb"
