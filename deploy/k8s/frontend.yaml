# Streamlit frontend — public-facing via Cloudflare Tunnel
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ancap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ancap-scraper-frontend  # Tilt auto-injects the correct image ref
          ports:
            - containerPort: 8501
          env:
            - name: QUERY_API_URL
              value: "http://query-api:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ancap
spec:
  selector:
    app: frontend
  ports:
    - port: 8501
      targetPort: 8501
